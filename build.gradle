plugins {
    id 'java'
}

group = 'com.ironshield.demo'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    // Shared Vulnerability (Log4Shell)
    implementation 'org.apache.logging.log4j:log4j-core:2.14.1'

    // Unique to Repo B (scanner false positive — CVE-2014-3578 does not cover 5.3.15)
    implementation 'org.springframework:spring-web:5.3.15'
}